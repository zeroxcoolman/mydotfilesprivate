# APPLIACTIONS BLUR
windowrulev2 = noblur, tag:multimedia_video*
windowrulev2 = opacity 1.0, tag:multimedia_video*
windowrulev2 = opacity 0.8, tag:settings*
windowrulev2 = opacity 0.8, class:^(org.gnome.Nautilus)$
windowrulev2 = opacity 0.9, class:^(gedit|org.gnome.TextEditor|mousepad)$
windowrulev2 = opacity 0.9, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = opacity 0.9, class:^(kitty)$
windowrulev2 = "opacity 0.85 override 0.7 override 1 override", class:^(discord|vesktop|org.telegram.desktop)$
windowrulev2 = "opacity 0.8 override 0.6 override 1 override", class:^(Spotify)$
windowrulev2 = "opacity 0.9 override 0.7 override 1 override", class:^(zen)$
#windowrule = opacity 0.8 override 0.6 override 1 override, tag:viewer*

# LAYER RULES

layerrule = blur, class:^(rofi)$
layerrule = ignorezero true, class:^(rofi)$
layerrule = ignorealpha 0.5, class:^(rofi)$
layerrule = animation popin 80%, class:^(rofi)$

layerrule = blur, class:^(waybar)$
layerrule = ignorealpha 0.5, class:^(waybar)$
layerrule = ignorealpha 0.5, tag:notif*
layerrule = blur, class:^(logout_dialog)$

layerrule = blur, class:^(swaync-control-center)$
layerrule = blur, class:^(swaync-notification-window)$
layerrule = ignorezero true, class:^(swaync-control-center)$
layerrule = ignorezero true, class:^(swaync-notification-window)$
layerrule = ignorealpha 0.5, class:^(swaync-control-center)$
layerrule = ignorealpha 0.5, class:^(swaync-notification-window)$
layerrule = xray 0, class:^(swaync-control-center)$
layerrule = xray 0, class:^(swaync-notification-window)$


#FLOAT
windowrule = float, tag:settings*
windowrule = float, tag:viewer*
windowrule = float, tag:multimedia_video*
windowrule = size 900 506, tag:multimedia_video*
windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = size 50% 60%, class:^(org.pulseaudio.pavucontrol)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# POP UPS AND DIALOGUES
windowrule = float, title:^(Save As|Save a File|Pick Files)$
windowrule = size 50% 60%, title:^(Save As|Save a File|Pick Files)$
windowrule = center, title:^(Save As|Save a File|Pick Files)$

windowrule = float, initialTitle:(Open Files)
windowrule = size 70% 60%, initialTitle:(Open Files)
