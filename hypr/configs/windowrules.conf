# ───────────────────────────────────────────────
#  OPACITY & VISUAL RULES
# ───────────────────────────────────────────────

windowrule {
  name = video-no-blur
  match:tag = multimedia_video*
  opacity = 1.0
  no_blur = on
}

windowrule {
  name = settings-opacity
  match:tag = settings*
  opacity = 0.8
}

windowrule {
  name = nautilus-opacity
  match:class = org.gnome.Nautilus
  opacity = 0.8
}

windowrule {
  name = textedit-gedit
  match:class = gedit
  opacity = 0.9
}

windowrule {
  name = textedit-gnome
  match:class = org.gnome.TextEditor
  opacity = 0.9
}

windowrule {
  name = textedit-mousepad
  match:class = mousepad
  opacity = 0.9
}

windowrule {
  name = pavu-opacity
  match:class = org.pulseaudio.pavucontrol
  opacity = 0.9
}

windowrule {
  name = kitty-opacity
  match:class = kitty
  opacity = 0.9
}

windowrule {
  name = discord-opacity
  match:class = discord
  opacity = 0.85 0.70
}

windowrule {
  name = vesktop-opacity
  match:class = vesktop
  opacity = 0.85 0.70
}

windowrule {
  name = telegram-opacity
  match:class = org.telegram.desktop
  opacity = 0.85 0.70
}

windowrule {
  name = spotify-opacity
  match:class = Spotify
  opacity = 0.80 0.60
}

windowrule {
  name = zen-opacity
  match:class = zen
  opacity = 0.90 0.70
}

# ───────────────────────────────────────────────
#  LAYER RULES — CORRECT SYNTAX FOR HYPRLAND 0.53+
# ───────────────────────────────────────────────

# Rofi
layerrule {
  name = rofi-layer
  match:namespace = rofi
  blur = on
  ignore_alpha = 0.5
}

# Waybar
layerrule {
  name = waybar-layer
  match:namespace = waybar
  blur = on
  ignore_alpha = 0.5
}

# SwayNC Control Center
layerrule {
  name = swaync-control
  match:namespace = swaync-control-center
  blur = on
  ignore_alpha = 0.5
  xray = on
}

# SwayNC Notification Window
layerrule {
  name = swaync-notification
  match:namespace = swaync-notification-window
  blur = on
  ignore_alpha = 0.5
  xray = on
}

# Logout dialog
layerrule {
  name = logout-dialog
  match:namespace = logout_dialog
  blur = on
}



# ───────────────────────────────────────────────
#  FLOATING WINDOWS
# ───────────────────────────────────────────────

windowrule {
  name = float-settings
  match:tag = settings*
  float = on
}

windowrule {
  name = float-viewer
  match:tag = viewer*
  float = on
}

windowrule {
  name = float-video
  match:tag = multimedia_video*
  float = on
  size = 900 506
}

windowrule {
  name = float-pavu
  match:class = org.pulseaudio.pavucontrol
  float = on
  size = 50% 60%
}


# ───────────────────────────────────────────────
#  XWAYLAND & MAXIMIZE FIXES
# ───────────────────────────────────────────────

windowrule {
  name = suppress-maximize
  match:class = .*
  suppress_event = maximize
}

windowrule {
  name = xwayland-dragfix
  match:class = ^$
  match:title = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false
  no_focus = on
}


# ───────────────────────────────────────────────
#  FILE PICKERS & DIALOGS
# ───────────────────────────────────────────────

windowrule {
  name = file-dialogs
  match:title = ^(Save As|Save a File|Pick Files)$
  float = on
  center = on
  size = 50% 60%
}

windowrule {
  name = open-files
  match:initial_title = ^Open Files$
  float = on
  size = 70% 60%
}
