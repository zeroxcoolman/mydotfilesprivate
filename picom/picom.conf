# Defaults
inactive-dim-fixed = true;

#backend = "xrender";
backend = "glx";
#xrender-sync-fence=true;

xinerama-shadow-crop = true;
vsync = true;


# Custom opacity for terminal

inactive-opacity = 0.85;
inactive-opacity-override = true;
inactive-dim = 0.1;
inactive-dim-fixed = true;

blur-background-exclude = [
  "class_g = 'maim'",
  "class_g = 'slop'",
];

rules = (
  # Polybar — allow shadow, disable fade and animations
  {
    match = "class_i = 'polybar'";
    shadow = false;
    focus = false;
    fade = false;
    animations = (
      {
        triggers = ["open", "show"];
        opacity = {
          curve = "cubic-bezier(0,1,1,1)";
          duration = 0.1;
          start = 0;
          end = "window-raw-opacity";
        };
      }
    );
  },
);




#################################
#             Shadows           #
#################################

shadow = false;

# The blur radius for shadows, in pixels. (defaults to 12)
shadow-radius = 30;

# The opacity of shadows. (0.0 - 1.0, defaults to 0.75)
#shadow-opacity = 0.85
shadow-opacity = 0.75

#shadow-opacity = 0.8;
#shadow-offset-x = 4;
#shadow-offset-y = 4;




#################################
#           Blur            #
#################################

blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
}


#################################
#     Animation Settings    #
#################################

animations = (
  # CLOSE — zoom out + fade
  {
    triggers = ["close"];
    opacity = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.25;
      start = "window-raw-opacity-before";
      end = 0;
    };
    scale-x = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.25;
      start = 1;
      end = 0.85;
    };
    scale-y = "scale-x";
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # OPEN — zoom in + fade
  {
    triggers = ["open"];
    opacity = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.28;
      start = 0;
      end = "window-raw-opacity";
    };
    scale-x = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.28;
      start = 0.85;
      end = 1;
    };
    scale-y = "scale-x";
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # SHOW — fade in
  {
    triggers = ["show"];
    opacity = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.28;
      start = 0;
      end = "window-raw-opacity";
    };
  },

  # HIDE — fade out
  {
    triggers = ["hide"];
    opacity = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.28;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },

  # GEOMETRY — resize/move smoothing
  

# Smooth, no-bounce geometry animation
  {
    triggers = ["geometry"]
    scale-x = {
      curve = "cubic-bezier(0,0,0,1.28)";
      duration = 0.35;
      start = "window-width-before / window-width";
      end = 1;
    }
    scale-y = {
      curve = "cubic-bezier(0,0,0,1.28)";
      duration = 0.35;
      start = "window-height-before / window-height";
      end = 1;
    }
    offset-x = {
      curve = "cubic-bezier(0,0,0,1.28)";
      duration = 0.35;
      start = "window-x-before - window-x";
      end = 0;
    }
    offset-y = {
      curve = "cubic-bezier(0,0,0,1.28)";
      duration = 0.35;
      start = "window-y-before - window-y";
      end = 0;
    }

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }


);

